name: Tests

on:
  push:
    paths:
      - "checker.py"
      - "test_checker.py"
      - "config.yaml"
      - "requirements.txt"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -v
